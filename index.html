<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expense Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #e9e9ed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #171717;
  }
  .phone {
    width: min(100%, 430px);
    min-height: 100vh;
    margin: 0 auto;
    background: #fff;
    overflow: hidden;
  }
  .status {
    height: 40px;
    padding: 8px 45px 0 45px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
  }

  /* Time display */
  #clock {
    font-size: 15px;
    font-weight: 700;
    height: 16px;
    line-height: 16px;
    display: flex;
    align-items: center;
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  
  /* Signal bars container with fully rounded corners */
  .signal { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .signal i { width: 4px; background: #111; border-radius: 2px; display:block; }
  .signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:12px}.signal i:nth-child(4){height:16px}
  
  /* Wi-Fi SVG icon */
  .wifi-icon {
    display: block;
    width: 24px;
    height: 19px;
  }

  /* Battery container */
  .battery {
    width: 27px;
    height: 16px;
    border: 1.8px solid #111;
    border-radius: 4px;
    position: relative;
    padding: 1px;
  }
  .battery:after { content:""; position:absolute; right:-4px; top:4px; width:2px; height:5px; background:#111; border-radius:1px; }
  .battery span { display:block; width:100%; height:100%; background:#111; border-radius:1px; }

  header { padding: 18px 20px 15px; border-bottom: 1px solid #ececef; }
  .title-row { display:flex; align-items:center; gap:12px; }
  .back-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171717;
  }
  h1 { margin:0; font-size:27px; letter-spacing:-.6px; }

  .controls { padding: 15px 16px 8px; display:flex; gap:9px; }
  .search {
    flex:1; border:1px solid #dedee3; border-radius:12px; padding:12px 13px;
    font-size:15px; outline:none; background:#fafafa;
  }
  .search:focus { border-color:#9b9ba2; background:#fff; }
  .add {
    border:0; border-radius:12px; padding:0 16px; background:#111; color:#fff;
    font-weight:700; font-size:15px; cursor:pointer;
  }

  .list { padding: 0 18px 100px; }
  .expense {
    min-height: 79px; padding: 15px 3px 14px;
    border-bottom:1px solid #ededf0;
    display:flex; justify-content:space-between; gap:15px;
  }
  .merchant { font-size:16px; font-weight:600; line-height:1.15; }
  .date { margin-top:7px; font-size:12px; color:#8a8a90; }
  .amount { font-size:16px; font-weight:600; white-space:nowrap; text-align:right; }
  .income-amount { color:#21864b; }
  .empty { padding:45px 20px; text-align:center; color:#8a8a90; font-size:14px; }

  .modal-backdrop {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.38);
    align-items:flex-end; justify-content:center; z-index:10;
  }
  .modal-backdrop.open { display:flex; }
  .modal {
    width:min(100%,430px); background:#fff; border-radius:22px 22px 0 0;
    padding:19px 20px 25px; box-shadow:0 -5px 30px rgba(0,0,0,.15);
  }
  .grabber { width:38px; height:4px; background:#d2d2d6; border-radius:3px; margin:0 auto 18px; }
  .modal h2 { margin:0 0 17px; font-size:22px; }
  label { display:block; margin:12px 0 6px; font-size:13px; color:#67676d; font-weight:600; }
  input[type="text"], input[type="number"], input[type="date"] {
    width:100%; padding:13px 12px; border:1px solid #dcdce1; border-radius:11px;
    font-size:16px; outline:none; background:#fafafa;
  }
  .type-toggle { display:flex; gap:7px; padding:4px; background:#f1f1f3; border-radius:12px; }
  .type-btn { flex:1; border:0; border-radius:9px; padding:10px; background:transparent; font-size:15px; font-weight:600; color:#666; cursor:pointer; }
  .type-btn.active { background:#fff; color:#111; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .save {
    width:100%; margin-top:18px; padding:14px; border:0; border-radius:12px;
    background:#111; color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }
  .cancel {
    width:100%; margin-top:8px; padding:12px; border:0; background:transparent;
    font-size:15px; color:#555; cursor:pointer;
  }
  @media (min-width: 600px) {
    .phone { margin: 20px auto; min-height: calc(100vh - 40px); border-radius:28px; box-shadow:0 8px 35px rgba(0,0,0,.12); }
    .modal-backdrop { align-items:center; }
    .modal { border-radius:22px; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span id="clock">8:03 PM</span>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="3.8" stroke-linecap="round" aria-label="Wi-Fi">
        <circle cx="12" cy="18" r="1.8" fill="#111" stroke="none" />
        <path d="M7.5 13.5a6.5 6.5 0 0 1 9 0" />
        <path d="M4 9.5a11.5 11.5 0 0 1 16 0" />
      </svg>
      <div class="battery"><span></span></div>
    </div>
  </div>

  <header>
    <div class="title-row">
      <button class="back-btn" aria-label="Go back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <h1>Recent Transactions</h1>
    </div>
  </header>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Search">
    <button class="add" id="openAdd">Filter</button>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="grabber"></div>
    <h2>Add transaction</h2>
    <div class="type-toggle">
      <button type="button" class="type-btn active expense-type" data-type="expense">Expense</button>
      <button type="button" class="type-btn income-type" data-type="income">Income</button>
    </div>
    <label for="merchant" id="merchantLabel">Expense / Merchant</label>
    <input id="merchant" type="text" placeholder="e.g. MAX'S RESTAURANT" autocomplete="off">
    <label for="amount">Amount (PHP)</label>
    <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
    <label for="date">Date</label>
    <input id="date" type="date">
    <button class="save" id="save">Add expense</button>
    <button class="cancel" id="cancel">Cancel</button>
  </div>
</div>

<script>
  const STORAGE_KEY = "simple_expense_tracker_v1";
  let expenses = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let transactionType = "expense";

  const money = n => new Intl.NumberFormat("en-PH", {
    style:"currency", currency:"PHP", minimumFractionDigits:2
  }).format(n);

  function formatDate(value) {
    const d = new Date(value + "T00:00:00");
    return d.toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"});
  }

  function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
      now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", hour12:false});
  }

  function render() {
    const query = document.getElementById("search").value.trim().toLowerCase();
    const filtered = expenses
      .filter(e => e.merchant.toLowerCase().includes(query))
      .sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created);

    const list = document.getElementById("list");
    if (!filtered.length) {
      list.innerHTML = `<div class="empty">${expenses.length ? "No matching expenses." : "No expenses yet. Tap + Add to get started."}</div>`;
      return;
    }
    list.innerHTML = filtered.map(e => `
      <div class="expense">
        <div>
          <div class="merchant">${escapeHtml(e.merchant)}</div>
          <div class="date">${formatDate(e.date)}</div>
        </div>
        <div class="amount ${e.type === "income" ? "income-amount" : "expense-amount"}">${e.type === "income" ? "+" : "-"}${money(Number(e.amount))}</div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }

  document.querySelectorAll(".type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      transactionType = btn.dataset.type;
      document.querySelectorAll(".type-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("merchantLabel").textContent =
        transactionType === "income" ? "Income / Source" : "Expense / Merchant";
      document.getElementById("merchant").placeholder =
        transactionType === "income" ? "e.g. Salary" : "e.g. MAX'S RESTAURANT";
      document.getElementById("save").textContent =
        transactionType === "income" ? "Add income" : "Add expense";
    });
  });

  function openModal() {
    document.getElementById("date").value = new Date().toISOString().slice(0,10);
    document.getElementById("modalBackdrop").classList.add("open");
    setTimeout(() => document.getElementById("merchant").focus(), 80);
  }
  function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("open");
    document.getElementById("merchant").value = "";
    document.getElementById("amount").value = "";
  }

  document.getElementById("openAdd").onclick = openModal;
  document.getElementById("cancel").onclick = closeModal;
  document.getElementById("search").oninput = render;

  document.getElementById("save").onclick = () => {
    const merchant = document.getElementById("merchant").value.trim();
    const amount = Number(document.getElementById("amount").value);
    const date = document.getElementById("date").value;

    if (!merchant || !amount || amount <= 0 || !date) {
      alert("Please enter the transaction, amount, and date.");
      return;
    }
    expenses.push({merchant, amount, date, type:transactionType, created:Date.now()});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    closeModal();
    render();
  };

  document.getElementById("modalBackdrop").addEventListener("click", e => {
    if (e.target.id === "modalBackdrop") closeModal();
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
    if (e.key === "Enter" && document.getElementById("modalBackdrop").classList.contains("open")) {
      document.getElementById("save").click();
    }
  });

  updateClock();
  setInterval(updateClock, 1000);
  render();
</script>
</body>
</html>
